<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Me - Link in Bio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #7b68ee; /* Tono morado exacto de la referencia */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-8 px-4 text-white font-sans">

    <!-- Contenedor Principal -->
    <main class="w-full max-w-md flex flex-col items-center">

        <!-- Círculo de Perfil perfectamente centrado y sin bordes visibles -->
        <div class="w-64 h-64 rounded-full overflow-hidden shadow-xl mb-6 bg-white flex items-center justify-center">
            <img src="logotapmecircular.png" alt="Tap Me Logo" class="w-full h-full object-cover scale-[1.18]">
        </div>

        <!-- Subtítulo de Autor -->
        <div class="text-center mb-8">
            <h2 class="text-sm font-bold tracking-widest">TAP ME</h2>
            <p class="text-xs tracking-wider opacity-90">BY JULIANA BARREIRO</p>
        </div>

        <!-- Botones de Enlaces -->
        <div class="w-full flex flex-col gap-4">

            <!-- Botón 1: Guardar Contacto -->
            <button onclick="descargarVCard()" class="w-full flex items-center justify-between border border-white/70 rounded-full px-5 py-3.5 bg-white/10 hover:bg-white/20 transition-all duration-300 backdrop-blur-sm group cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full border border-white/60 flex items-center justify-center text-sm">
                        <i class="fa-solid fa-address-card"></i>
                    </div>
                    <span class="text-sm font-semibold tracking-wider">GUARDAR CONTACTO</span>
                </div>
                <i class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
            </button>

            <!-- Botón 2: WhatsApp -->
            <a href="https://wa.me/593988725270" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between border border-white/70 rounded-full px-5 py-3.5 bg-white/10 hover:bg-white/20 transition-all duration-300 backdrop-blur-sm group">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full border border-white/60 flex items-center justify-center text-sm">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <span class="text-sm font-semibold tracking-wider">WHATSAPP</span>
                </div>
                <i class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
            </a>

            <!-- Botón 3: Reseña de Google -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJL3xIbROQ1ZERsyksKTjkTUk" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between border border-white/70 rounded-full px-5 py-3.5 bg-white/10 hover:bg-white/20 transition-all duration-300 backdrop-blur-sm group">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full border border-white/60 flex items-center justify-center text-sm">
                        <i class="fa-solid fa-g"></i>
                    </div>
                    <span class="text-sm font-semibold tracking-wider">RESEÑA DE GOOGLE</span>
                </div>
                <i class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
            </a>

            <!-- Botón 4: Instagram -->
            <a href="https://www.instagram.com/tapme.ec?srtk=OG9vOWowZGMxNnFy%20ubishi?stkn=MXViejNyc3gzZmZ0Yg==" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between border border-white/70 rounded-full px-5 py-3.5 bg-white/10 hover:bg-white/20 transition-all duration-300 backdrop-blur-sm group">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full border border-white/60 flex items-center justify-center text-sm">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span class="text-sm font-semibold tracking-wider">INSTAGRAM</span>
                </div>
                <i class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
            </a>

            <!-- Botón 5: TikTok -->
            <a href="https://www.tiktok.com/@tap.me.ec?_r=1&_t=ZS-9AZupRna7JE" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between border border-white/70 rounded-full px-5 py-3.5 bg-white/10 hover:bg-white/20 transition-all duration-300 backdrop-blur-sm group">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full border border-white/60 flex items-center justify-center text-sm">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <span class="text-sm font-semibold tracking-wider">TIK TOK</span>
                </div>
                <i class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
            </a>

        </div>

    </main>

    <!-- Script de descarga de contacto vCard con Nombre y Apellido separados -->
    <script>
        function descargarVCard() {
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Barreiro;Juliana;;;
FN:Juliana Barreiro
ORG:Tap Me
TITLE:NFC Cards & Link-in-Bio
TEL;TYPE=CELL:+593988725270
URL:https://wa.me/593988725270
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'contacto-tapme.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
